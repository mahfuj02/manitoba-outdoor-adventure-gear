# Remove the version line or update it
services:
  web:
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails server -b '0.0.0.0'"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
      - sqlite_data:/app/storage
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development

volumes:
  bundle_cache: {}
  sqlite_data: {}